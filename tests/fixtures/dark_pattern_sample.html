<!DOCTYPE html>
<html>
<head><title>Sample Dark Pattern Page</title></head>
<body>
  <form id="signup">
    <label>
      <input type="checkbox" checked id="marketing-optin">
      Uncheck to unsubscribe from promotional emails
    </label>
  </form>

  <div>
    <a href="/cancel" style="opacity: 0.02; font-size: 16px;">Cancel my subscription</a>
  </div>

  <div id="cookie-banner">
    <button style="background-color: rgb(0, 122, 255); color: white; padding: 10px;">Accept All</button>
    <a href="#" style="background-color: transparent; color: #888;">Reject All</a>
  </div>
</body>
</html>
